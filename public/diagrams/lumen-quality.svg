<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 330" role="img"><title>LUMEN 렌더러 폴백과 품질 자동 조절</title><desc>WebGPU 어댑터가 있으면 WebGPU, 없으면 같은 렌더러의 WebGL2 백엔드, 둘 다 없으면 포스터 이미지로 그린다. 시작 품질은 GPU 등급으로 정하고, 실행 중에는 1초마다 fps를 재서 30 미만이면 내리고 두 번 연속 58 이상이면 올린다</desc>
<style>
.bx{stroke-width:.5}
.pf{fill:#EEEDFE;stroke:#534AB7}.pt{fill:#3C3489}.ps{fill:#534AB7}
.tf{fill:#E1F5EE;stroke:#0F6E56}.tt{fill:#085041}.tsb{fill:#0F6E56}
.af{fill:#FAEEDA;stroke:#854F0B}.at{fill:#633806}.asb{fill:#854F0B}
.ln{stroke:#73726c;stroke-width:1.5;fill:none}
.dsh{stroke:#73726c;stroke-width:.5;fill:none;stroke-dasharray:4 4}
.lbl{fill:#73726c}
text{font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.t14{font-size:14px;font-weight:500}.t12{font-size:12px;font-weight:400}.t11{font-size:11px;font-weight:400}
:root[data-theme="dark"] .pf{fill:#3C3489;stroke:#AFA9EC}
:root[data-theme="dark"] .pt{fill:#CECBF6}
:root[data-theme="dark"] .ps{fill:#AFA9EC}
:root[data-theme="dark"] .tf{fill:#085041;stroke:#5DCAA5}
:root[data-theme="dark"] .tt{fill:#9FE1CB}
:root[data-theme="dark"] .tsb{fill:#5DCAA5}
:root[data-theme="dark"] .af{fill:#633806;stroke:#EF9F27}
:root[data-theme="dark"] .at{fill:#FAC775}
:root[data-theme="dark"] .asb{fill:#EF9F27}
:root[data-theme="dark"] .ln,:root[data-theme="dark"] .dsh{stroke:#9c9a92}
:root[data-theme="dark"] .lbl{fill:#9c9a92}
@media (prefers-color-scheme:dark){
:root:not([data-theme]) .pf{fill:#3C3489;stroke:#AFA9EC}
:root:not([data-theme]) .pt{fill:#CECBF6}
:root:not([data-theme]) .ps{fill:#AFA9EC}
:root:not([data-theme]) .tf{fill:#085041;stroke:#5DCAA5}
:root:not([data-theme]) .tt{fill:#9FE1CB}
:root:not([data-theme]) .tsb{fill:#5DCAA5}
:root:not([data-theme]) .af{fill:#633806;stroke:#EF9F27}
:root:not([data-theme]) .at{fill:#FAC775}
:root:not([data-theme]) .asb{fill:#EF9F27}
:root:not([data-theme]) .ln,:root:not([data-theme]) .dsh{stroke:#9c9a92}
:root:not([data-theme]) .lbl{fill:#9c9a92}
}
</style>
<defs><marker id="ah-lumen-quality" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="20" y="24" class="t12 lbl">무엇으로 그릴까 — 접속할 때 한 번</text>
<g><rect x="20" y="36" width="150" height="56" rx="8" class="bx pf"/><text x="95" y="60" text-anchor="middle" class="t14 pt">WebGPU 어댑터</text><text x="95" y="78" text-anchor="middle" class="t12 ps">requestAdapter()</text></g>
<g><rect x="265" y="36" width="150" height="56" rx="8" class="bx pf"/><text x="340" y="60" text-anchor="middle" class="t14 pt">WebGL2 컨텍스트</text><text x="340" y="78" text-anchor="middle" class="t12 ps">같은 렌더러 · forceWebGL</text></g>
<g><rect x="510" y="36" width="150" height="56" rx="8" class="bx af"/><text x="585" y="60" text-anchor="middle" class="t14 at">포스터 이미지</text><text x="585" y="78" text-anchor="middle" class="t12 asb">상품 정보는 그대로</text></g>
<line x1="170" y1="64" x2="261" y2="64" class="ln" marker-end="url(#ah-lumen-quality)"/><text x="215" y="56" text-anchor="middle" class="t11 lbl">null · 실패</text>
<line x1="415" y1="64" x2="506" y2="64" class="ln" marker-end="url(#ah-lumen-quality)"/><text x="460" y="56" text-anchor="middle" class="t11 lbl">없음</text>
<line x1="95" y1="92" x2="95" y2="126" class="dsh"/><line x1="340" y1="92" x2="340" y2="126" class="dsh"/>
<text x="217" y="118" text-anchor="middle" class="t11 lbl">어느 쪽이든 노드 머티리얼 · TSL로만 그린다</text>

<text x="20" y="152" class="t12 lbl">얼마나 그릴까 — 시작 판정 + 1초마다 재판정</text>
<g><rect x="20" y="164" width="150" height="56" rx="8" class="bx tf"/><text x="95" y="188" text-anchor="middle" class="t14 tt">GPU 등급</text><text x="95" y="206" text-anchor="middle" class="t12 tsb">detect-gpu · 모바일 최대 mid</text></g>
<g><rect x="265" y="164" width="150" height="56" rx="8" class="bx tf"/><text x="340" y="188" text-anchor="middle" class="t14 tt">품질 단계</text><text x="340" y="206" text-anchor="middle" class="t12 tsb">low · mid · high</text></g>
<g><rect x="510" y="164" width="150" height="56" rx="8" class="bx tf"/><text x="585" y="188" text-anchor="middle" class="t14 tt">1초 창 평균 fps</text><text x="585" y="206" text-anchor="middle" class="t12 tsb">useFrame으로 측정</text></g>
<line x1="170" y1="192" x2="261" y2="192" class="ln" marker-end="url(#ah-lumen-quality)"/><text x="215" y="184" text-anchor="middle" class="t11 lbl">시작값</text>
<line x1="415" y1="192" x2="506" y2="192" class="ln" marker-end="url(#ah-lumen-quality)"/>
<path d="M585 220 V250 H340 V224" class="ln" marker-end="url(#ah-lumen-quality)"/>
<text x="462" y="266" text-anchor="middle" class="t11 lbl">30 미만 → 한 단계 내림 · 두 번 연속 58 이상 → 올림</text>
<text x="462" y="282" text-anchor="middle" class="t11 lbl">시작 직후 2초 · 탭 숨김 구간은 판단에서 뺀다</text>
<line x1="340" y1="250" x2="340" y2="296" class="dsh"/>
<text x="20" y="314" class="t12 lbl">단계가 바꾸는 것</text>
<text x="128" y="314" class="t12 lbl">렌더 해상도(DPR) · 그림자 맵 · bloom · AO(GTAO) · 모델 텍스처 1k / 2k</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 290" role="img"><title>명당재팬 데이터 파이프라인</title><desc>GitHub Actions가 신문 기사와 공식 사이트에서 수집하고, 확실한 좌표만 자동으로 핀을 찍으며 나머지는 확인 대기 큐를 거쳐 사람이 보정한 뒤 정적 HTML로 빌드된다</desc>
<style>
.bx{stroke-width:.5}
.pf{fill:#EEEDFE;stroke:#534AB7}.pt{fill:#3C3489}.ps{fill:#534AB7}
.tf{fill:#E1F5EE;stroke:#0F6E56}.tt{fill:#085041}.tsb{fill:#0F6E56}
.af{fill:#FAEEDA;stroke:#854F0B}.at{fill:#633806}.asb{fill:#854F0B}
.ln{stroke:#73726c;stroke-width:1.5;fill:none}
.dsh{stroke:#73726c;stroke-width:.5;fill:none;stroke-dasharray:4 4}
.thin{stroke:#73726c;stroke-width:.5;fill:none}
.lbl{fill:#73726c}
text{font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.t14{font-size:14px;font-weight:500}.t12{font-size:12px;font-weight:400}
:root[data-theme="dark"] .pf{fill:#3C3489;stroke:#AFA9EC}
:root[data-theme="dark"] .pt{fill:#CECBF6}
:root[data-theme="dark"] .ps{fill:#AFA9EC}
:root[data-theme="dark"] .tf{fill:#085041;stroke:#5DCAA5}
:root[data-theme="dark"] .tt{fill:#9FE1CB}
:root[data-theme="dark"] .tsb{fill:#5DCAA5}
:root[data-theme="dark"] .af{fill:#633806;stroke:#EF9F27}
:root[data-theme="dark"] .at{fill:#FAC775}
:root[data-theme="dark"] .asb{fill:#EF9F27}
:root[data-theme="dark"] .ln,:root[data-theme="dark"] .dsh,:root[data-theme="dark"] .thin{stroke:#9c9a92}
:root[data-theme="dark"] .lbl{fill:#9c9a92}
@media (prefers-color-scheme:dark){
:root:not([data-theme]) .pf{fill:#3C3489;stroke:#AFA9EC}
:root:not([data-theme]) .pt{fill:#CECBF6}
:root:not([data-theme]) .ps{fill:#AFA9EC}
:root:not([data-theme]) .tf{fill:#085041;stroke:#5DCAA5}
:root:not([data-theme]) .tt{fill:#9FE1CB}
:root:not([data-theme]) .tsb{fill:#5DCAA5}
:root:not([data-theme]) .af{fill:#633806;stroke:#EF9F27}
:root:not([data-theme]) .at{fill:#FAC775}
:root:not([data-theme]) .asb{fill:#EF9F27}
:root:not([data-theme]) .ln,:root:not([data-theme]) .dsh,:root:not([data-theme]) .thin{stroke:#9c9a92}
:root:not([data-theme]) .lbl{fill:#9c9a92}
}
</style>
<defs><marker id="ah-meisho-pipeline" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g><rect x="20" y="46" width="140" height="56" rx="8" class="bx pf"/><text class="t14 pt" x="90" y="64" text-anchor="middle" dominant-baseline="central">출처 3곳</text><text class="t12 ps" x="90" y="84" text-anchor="middle" dominant-baseline="central">신문 · 공식 · 국토지리원</text></g>
<line x1="162" y1="74" x2="188" y2="74" class="ln" marker-end="url(#ah-meisho-pipeline)"/>
<g><rect x="190" y="46" width="140" height="56" rx="8" class="bx pf"/><text class="t14 pt" x="260" y="64" text-anchor="middle" dominant-baseline="central">수집</text><text class="t12 ps" x="260" y="84" text-anchor="middle" dominant-baseline="central">Actions cron · cheerio</text></g>
<line x1="332" y1="74" x2="358" y2="74" class="ln" marker-end="url(#ah-meisho-pipeline)"/>
<g><rect x="360" y="46" width="140" height="56" rx="8" class="bx tf"/><text class="t14 tt" x="430" y="64" text-anchor="middle" dominant-baseline="central">핀 판정</text><text class="t12 tsb" x="430" y="84" text-anchor="middle" dominant-baseline="central">fail-closed 3조건</text></g>
<line x1="502" y1="74" x2="528" y2="74" class="ln" marker-end="url(#ah-meisho-pipeline)"/>
<g><rect x="530" y="46" width="140" height="56" rx="8" class="bx pf"/><text class="t14 pt" x="600" y="64" text-anchor="middle" dominant-baseline="central">data/curated</text><text class="t12 ps" x="600" y="84" text-anchor="middle" dominant-baseline="central">zod 스키마 검증</text></g>
<line x1="408" y1="104" x2="408" y2="194" class="ln" marker-end="url(#ah-meisho-pipeline)"/><text class="t12 lbl" x="400" y="149" text-anchor="end" dominant-baseline="central">불확실</text>
<line x1="452" y1="194" x2="452" y2="104" class="ln" marker-end="url(#ah-meisho-pipeline)"/><text class="t12 lbl" x="460" y="149" dominant-baseline="central">수동 좌표</text>
<line x1="600" y1="104" x2="600" y2="194" class="ln" marker-end="url(#ah-meisho-pipeline)"/>
<g><rect x="360" y="196" width="140" height="56" rx="8" class="bx af"/><text class="t14 at" x="430" y="214" text-anchor="middle" dominant-baseline="central">확인 대기 큐</text><text class="t12 asb" x="430" y="234" text-anchor="middle" dominant-baseline="central">핀 없이 "위치 확인 중"</text></g>
<g><rect x="530" y="196" width="140" height="56" rx="8" class="bx pf"/><text class="t14 pt" x="600" y="214" text-anchor="middle" dominant-baseline="central">정적 HTML 300+</text><text class="t12 ps" x="600" y="234" text-anchor="middle" dominant-baseline="central">Cloudflare Pages</text></g>
</svg>

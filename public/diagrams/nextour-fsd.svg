<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 266" role="img"><title>NEXTOUR FSD 5-레이어 단방향 의존성</title><desc>app, widgets, features, entities, shared 순으로 상위 레이어만 하위 레이어를 import하며 barrel index.ts와 ESLint 규칙이 이를 강제한다</desc>
<style>

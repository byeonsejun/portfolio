<path d="M338 188 L133 188 L133 106" class="ln" marker-end="url(#ah-seflix-flow)"/>
<g><rect x="180" y="240" width="320" height="56" rx="8" class="bx af"/><text class="t14 at" x="340" y="258" text-anchor="middle" dominant-baseline="central">URL 쿼리 = 탐색 상태의 단일 진실</text><text class="t12 asb" x="340" y="278" text-anchor="middle" dominant-baseline="central">새로고침 · 뒤로가기 · 공유에도 복원</text></g>

<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 296" role="img"><title>서울, 너와 함께 BFF 아키텍처</title><desc>웹과 React Native 앱이 동일한 API 계약을 공유하고 Next.js Route Handlers가 BFF 계층으로 외부 API 키를 서버에만 보관한다</desc>
<style>
.bx{stroke-width:.5}
.pf{fill:#EEEDFE;stroke:#534AB7}.pt{fill:#3C3489}.ps{fill:#534AB7}
.tf{fill:#E1F5EE;stroke:#0F6E56}.tt{fill:#085041}.tsb{fill:#0F6E56}
.af{fill:#FAEEDA;stroke:#854F0B}.at{fill:#633806}.asb{fill:#854F0B}
.ln{stroke:#73726c;stroke-width:1.5;fill:none}
.dsh{stroke:#73726c;stroke-width:.5;fill:none;stroke-dasharray:4 4}
.thin{stroke:#73726c;stroke-width:.5;fill:none}
.lbl{fill:#73726c}
text{font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.t14{font-size:14px;font-weight:500}.t12{font-size:12px;font-weight:400}
:root[data-theme="dark"] .pf{fill:#3C3489;stroke:#AFA9EC}
:root[data-theme="dark"] .pt{fill:#CECBF6}
:root[data-theme="dark"] .ps{fill:#AFA9EC}
:root[data-theme="dark"] .tf{fill:#085041;stroke:#5DCAA5}
:root[data-theme="dark"] .tt{fill:#9FE1CB}
:root[data-theme="dark"] .tsb{fill:#5DCAA5}
:root[data-theme="dark"] .af{fill:#633806;stroke:#EF9F27}
:root[data-theme="dark"] .at{fill:#FAC775}
:root[data-theme="dark"] .asb{fill:#EF9F27}
:root[data-theme="dark"] .ln,:root[data-theme="dark"] .dsh,:root[data-theme="dark"] .thin{stroke:#9c9a92}
:root[data-theme="dark"] .lbl{fill:#9c9a92}
@media (prefers-color-scheme:dark){
:root:not([data-theme]) .pf{fill:#3C3489;stroke:#AFA9EC}
:root:not([data-theme]) .pt{fill:#CECBF6}
:root:not([data-theme]) .ps{fill:#AFA9EC}
:root:not([data-theme]) .tf{fill:#085041;stroke:#5DCAA5}
:root:not([data-theme]) .tt{fill:#9FE1CB}
:root:not([data-theme]) .tsb{fill:#5DCAA5}
:root:not([data-theme]) .af{fill:#633806;stroke:#EF9F27}
:root:not([data-theme]) .at{fill:#FAC775}
:root:not([data-theme]) .asb{fill:#EF9F27}
:root:not([data-theme]) .ln,:root:not([data-theme]) .dsh,:root:not([data-theme]) .thin{stroke:#9c9a92}
:root:not([data-theme]) .lbl{fill:#9c9a92}
}
</style>
<defs><marker id="ah-seoul-bff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g><rect x="48" y="46" width="150" height="56" rx="8" class="bx pf"/><text class="t14 pt" x="123" y="64" text-anchor="middle" dominant-baseline="central">웹 클라이언트</text><text class="t12 ps" x="123" y="84" text-anchor="middle" dominant-baseline="central">Next.js · Zustand</text></g>
<g><rect x="48" y="130" width="150" height="56" rx="8" class="bx pf"/><text class="t14 pt" x="123" y="148" text-anchor="middle" dominant-baseline="central">네이티브 앱</text><text class="t12 ps" x="123" y="168" text-anchor="middle" dominant-baseline="central">React Native · Expo</text></g>
<path d="M200 74 L228 74 L228 116 L262 116" class="ln" marker-end="url(#ah-seoul-bff)"/><path d="M200 158 L228 158 L228 116 L262 116" class="ln" marker-end="url(#ah-seoul-bff)"/>
<rect x="264" y="46" width="176" height="140" rx="12" class="dsh"/><text class="t12 lbl" x="352" y="66" text-anchor="middle" dominant-baseline="central">키가 여기서 멈춘다</text>
<g><rect x="276" y="88" width="152" height="56" rx="8" class="bx tf"/><text class="t14 tt" x="352" y="106" text-anchor="middle" dominant-baseline="central">BFF 계층</text><text class="t12 tsb" x="352" y="126" text-anchor="middle" dominant-baseline="central">Route Handlers</text></g>
<text class="t12 lbl" x="352" y="166" text-anchor="middle" dominant-baseline="central">동일한 /api 계약 공유</text><line x1="442" y1="116" x2="474" y2="116" class="ln" marker-end="url(#ah-seoul-bff)"/>
<g><rect x="476" y="46" width="156" height="56" rx="8" class="bx tf"/><text class="t14 tt" x="554" y="64" text-anchor="middle" dominant-baseline="central">외부 API</text><text class="t12 tsb" x="554" y="84" text-anchor="middle" dominant-baseline="central">Maps · OpenWeather</text></g>
<g><rect x="476" y="130" width="156" height="56" rx="8" class="bx tf"/><text class="t14 tt" x="554" y="148" text-anchor="middle" dominant-baseline="central">정적 POI</text><text class="t12 tsb" x="554" y="168" text-anchor="middle" dominant-baseline="central">2,608건 · 4개 언어</text></g>
<path d="M474 116 L458 116 L458 158 L474 158" class="ln" marker-end="url(#ah-seoul-bff)"/>
<g><rect x="180" y="220" width="320" height="56" rx="8" class="bx af"/><text class="t14 at" x="340" y="238" text-anchor="middle" dominant-baseline="central">응답 페이로드 314KB → 9.9KB</text><text class="t12 asb" x="340" y="258" text-anchor="middle" dominant-baseline="central">base64 내장 대신 URL 반환</text></g>
</svg>
